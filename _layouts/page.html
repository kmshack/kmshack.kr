---
layout: blog
---
<article class="blog-page-shell shell" itemscope itemtype="https://schema.org/WebPage">
    <header class="page-header"><p class="blog-eyebrow">{{ page.eyebrow | default: 'WRITING' }}</p><h1 itemprop="headline">{{ page.title }}</h1>{% if page.description %}<p>{{ page.description }}</p>{% endif %}</header>
    <div class="entry page-entry" itemprop="mainContentOfPage">{{ content }}</div>
</article>
